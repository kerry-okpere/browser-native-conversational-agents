name: Publish codelab

# Deploys to GitHub Pages:
#   /                     the voice agent app, built with Vite
#   /codelab/live/        the run-on-the-page codelab, built with Vite
#   /browser-voice-agent/ codelab/src/voice-agent-codelab.md, built with Google's claat tool

on:
  push:
    branches: [main, feat/voice-agent-call, feat/gemma-litert-lm]
    paths:
      - "codelab/**"
      - "src/**"
      - "vite.config.ts"
      - "package-lock.json"
      - ".github/workflows/codelab.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install claat
        run: go install github.com/googlecodelabs/tools/claat@latest

      - name: Export codelab
        run: |
          mkdir -p public
          cd codelab/src
          ~/go/bin/claat export -o ../../public voice-agent-codelab.md
          # claat copies img/ only when referenced from a Google Doc source;
          # for Markdown sources copy the images next to the exported page.
          cp -r img ../../public/browser-voice-agent/ 2>/dev/null || true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build the app and the live codelab
        run: |
          npm ci
          # vite build on its own: `npm run build` also runs tsc, which fails on an existing error in src/workers/voice-to-text.ts
          npx vite build --base=/${{ github.event.repository.name }}/
          cp -r dist/. public/ # the app, the live codelab, the service worker and the LiteRT runtime

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
