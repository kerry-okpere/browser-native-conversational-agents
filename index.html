<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browser Native Conversational Agents</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap"
    />
  </head>
  <body data-call="idle">
    <header class="top">
      <span class="brand"><span class="mark"></span><span class="event"></span><span class="talk"></span></span>
      <span class="timer"></span>
    </header>
    <main>
      <start-button></start-button>
      <section class="call">
        <div class="stage">
          <voice-orb size="400"></voice-orb>
          <call-controls></call-controls>
        </div>
        <chat-box></chat-box>
      </section>
      <call-ended></call-ended>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
