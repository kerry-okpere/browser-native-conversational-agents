<section class="start">

  <ul>

      <span class="name">Speech-to-text</span>
      <progress max="1" value="0"></progress>

    </li>
    <li data-stage="llm">
      <span class="name">LLM</span>
      <progress max="1" value="0"></progress>

    <li data-stage="tts">
      <span class="name">Text-to-speech</span>
      <progress max="1" value="0"></progress>
      <span class="status">Checking…</span>
    </li>
  </ul>
</section>
