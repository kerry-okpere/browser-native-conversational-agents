<div class="chat">
  <div class="messages"></div>
  <form>
    <input type="text" placeholder="Say something…" autocomplete="off" />
    <button type="button" class="mic">Speak</button>
    <button class="send">Send</button>
  </form>
  <progress hidden max="100"></progress>
  <p class="status"></p>
</div>
