<div class="chat">
  <div class="messages"></div>
  <form>

      <input type="file" accept="image/*" hidden />
      <span>Image</span>
    </label>
    <input type="text" placeholder="Or type a message…" autocomplete="off" />
    <button class="primary">Send</button>
  </form>
</div>
