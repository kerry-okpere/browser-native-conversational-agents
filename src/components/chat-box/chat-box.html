<div class="chat">
  <div class="head">
    <span class="eyebrow">Transcript</span>
    <span class="turns">0 turns</span>
  </div>
  <div class="messages"></div>
  <form>
    <label class="attach icon" title="Show the agent a picture" tabindex="0">
      <input type="file" accept="image/*" hidden />
      <span class="picture">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 15l-5-5-8 8"></path></svg>
      </span>
    </label>
    <input type="text" placeholder="Or type instead…" autocomplete="off" aria-label="Type a message" />
    <button class="send">Send</button>
  </form>
</div>
