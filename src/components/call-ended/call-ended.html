<section class="ended">
  <voice-orb size="150" quiet></voice-orb>
  <div class="copy">
    <span class="eyebrow">Call ended</span>
    <h1 class="thanks">Thanks.</h1>
  </div>
  <dl class="stats">
    <div><dt>Length</dt><dd class="length">0:00</dd></div>
    <div><dt>Turns</dt><dd class="turns">0</dd></div>
    <div><dt>Avg. first word</dt><dd class="first">–</dd></div>
    <div class="used"><dt>Tools used</dt><dd class="tools">None</dd></div>
  </dl>
  <div class="actions">
    <button class="again primary">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"></path><path d="M21 3v6h-6"></path></svg>
      <span class="label">Start another call</span>
    </button>
    <button class="back quiet">Back to start</button>
  </div>
  <p class="notice" role="alert" hidden></p>
</section>
